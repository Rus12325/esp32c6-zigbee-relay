; ESP32-C6 Super Mini — Zigbee реле (On/Off) с физической кнопкой
; --------------------------------------------------------
; Используем форк pioarduino/platform-espressif32 — на момент
; написания это единственный надёжно работающий путь для сборки
; Zigbee-библиотеки Arduino на ESP32-C6 через PlatformIO
; (официальный platform espressif32 в реестре PlatformIO
; для C6+Zigbee часто ломается/отстаёт).
;
; ПЕРЕД СБОРКОЙ: зайдите на
; https://github.com/pioarduino/platform-espressif32/releases
; и, если есть более новый релиз, замените ссылку в строке "platform"

[platformio]
default_envs = esp32c6

[env:esp32c6]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1

board_build.f_flash = 80000000L
board_build.flash_mode = qio
; Партиция со служебным разделом под Zigbee-стек —
; файл идёт в комплекте с фреймворком, путь указывать не нужно
board_build.partitions = zigbee.csv

build_type = release
build_flags =
    -D ZIGBEE_MODE_ED

monitor_speed = 115200
upload_port = COM10
monitor_port = COM10

; При необходимости раскомментируйте и укажите свои порты вручную,
; если PlatformIO не находит плату автоматически:
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
